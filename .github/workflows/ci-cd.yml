name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m py_compile server.py

      - name: Start app smoke test
        run: |
          python server.py &
          echo $! > app.pid
          sleep 5
          python - <<'PY'
          import json
          import urllib.request

          health = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5))
          assert health["status"] == "ok", health

          summary = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/summary", timeout=5))
          assert summary["workflow_count"] >= 1, summary
          PY
          kill "$(cat app.pid)"

  docker:
    name: Build And Publish Container
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "${{ steps.image.outputs.name }}:${{ github.sha }}" -t "${{ steps.image.outputs.name }}:latest" .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"

  deploy-placeholder:
    name: Deployment Handoff
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Deployment notes
        run: |
          echo "Container image published to ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "Apply deploy/kubernetes manifests from your Kubernetes/OpenShift pipeline."
          echo "For cloud deployment, wire this job to your target environment secrets."
