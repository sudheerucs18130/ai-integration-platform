apiVersion: v1
kind: Secret
metadata:
  name: aip-ibm-secrets
type: Opaque
stringData:
  IBM_TELEMETRY_URL: "https://telemetry-bridge.example.com/integration-health"
  IBM_TELEMETRY_TOKEN: "replace-with-token"
  IBM_APPLICATIONS: |
    [
      {
        "name": "IBM App Connect Order Flow",
        "url": "https://application.example.com/health",
        "owner": "Integration Platform",
        "business_criticality": "mission_critical",
        "routing_group": "ibm-app-connect",
        "sla_target_ms": 900
      }
    ]
